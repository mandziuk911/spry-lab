services:
  db:
    image: postgres:16.8-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spry}
      POSTGRES_DB: ${POSTGRES_DB:-spry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12

  backend:
    build: ./back
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-spry}:${POSTGRES_PASSWORD:-spry}@db:5432/${POSTGRES_DB:-spry}
      CORS_ORIGINS: http://localhost:5173
      COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 20s
      retries: 12

  frontend:
    build: ./front
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_COGNITO_ISSUER: ${COGNITO_ISSUER:-}
      VITE_COGNITO_CLIENT_ID: ${COGNITO_CLIENT_ID:-}
      VITE_COGNITO_DOMAIN: ${COGNITO_DOMAIN:-}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
