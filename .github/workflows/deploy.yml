name: AWS deployment (OIDC)

on:
  workflow_run:
    workflows: [Quality checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Do not interrupt a running migration or CloudFormation operation.
concurrency:
  group: spry-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy verified main SHA
    if: >-
      github.repository == 'mandziuk911/spry-lab' &&
      github.event.workflow_run.head_repository.full_name == 'mandziuk911/spry-lab' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: eu-north-1
      AWS_DEFAULT_REGION: eu-north-1
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - name: Require permitted OIDC configuration
        run: |
          if [ -z "$AWS_DEPLOY_ROLE_ARN" ]; then
            echo '::error::AWS_DEPLOY_ROLE_ARN is not configured. This Free-plan account currently denies GitHub OIDC provider creation. Deployment is blocked; do not upgrade or substitute permanent keys.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Assume repository/main-scoped AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1
          allowed-account-ids: "673478369996"
          role-session-name: SpryGitHub-${{ github.run_id }}
          mask-aws-account-id: true
      - name: Verify account and Free-plan credit guard
        run: make aws-check
      - name: Deploy backend using shared local target
        run: make deploy-backend
      - name: Deploy frontend using shared local target
        run: make deploy-frontend
      - name: Deployed addresses
        run: make aws-outputs
