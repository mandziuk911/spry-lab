AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Spry private S3 frontend with CloudFront OAC and same-origin ECS ALB API routing.
  Uses the default CloudFront HTTPS hostname, with HTTP from CloudFront to the ALB.
  No flat-rate pricing subscription or custom domain is configured.

Parameters:
  ProjectName:
    Type: String
    Default: spry
    Description: Project name for resource tags and descriptions.
  BackendDomainName:
    Type: String
    MinLength: 1
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$'
    Description: Required ALB DNS hostname, without a scheme, port or path.
  OriginToken:
    Type: String
    NoEcho: true
    MinLength: 64
    MaxLength: 64
    AllowedPattern: '^[a-fA-F0-9]{64}$'
    ConstraintDescription: Must be exactly 64 hexadecimal characters.
    Description: Required secret shared with the ALB origin-header listener rule.

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${ProjectName}-frontend-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AuthRoutes:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${ProjectName}-auth-routes"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve only the known SPA authentication routes, never API errors.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/login' || request.uri === '/login/' ||
              request.uri === '/auth/callback' || request.uri === '/auth/callback/') {
            request.uri = '/index.html';
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      DistributionConfig:
        Comment: !Sub ${ProjectName} frontend and same-origin API
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Ref BackendDomainName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-Spry-Origin
                HeaderValue: !Ref OriginToken
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          # Managed CachingOptimized policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt AuthRoutes.FunctionARN
        # No OriginPath or URI rewrite: preserve /api paths and query strings.
        CacheBehaviors:
          - PathPattern: /api
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            # Managed CachingDisabled and AllViewerExceptHostHeader policies.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /api/*
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # CloudFront supports these error codes; 416 is never cached.
        # TTL only: never replace API JSON/status codes with an HTML SPA response.
        # CloudFront enforces a one-second minimum for errors from S3 origins.
        CustomErrorResponses:
          - { ErrorCode: 400, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 405, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 414, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 416, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 501, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Value: !Sub https://${Distribution.DomainName}
