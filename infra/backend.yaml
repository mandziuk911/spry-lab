AWSTemplateFormatVersion: "2010-09-09"
Description: Spry Free-plan backend - CloudFront-only ALB, ARM64 Fargate and private PostgreSQL.

Parameters:
  ProjectName:
    Type: String
    Default: spry
    AllowedPattern: "[a-z][a-z0-9-]{0,25}"
    Description: Resource name prefix and project tag.
  ImageUri:
    Type: String
    AllowedPattern: "[0-9]{12}\\.dkr\\.ecr\\.[a-z0-9-]+\\.amazonaws\\.com(\\.cn)?/[a-z0-9][a-z0-9._/-]*:[0-9a-f]{40}"
    Description: ECR image URI tagged with the full reviewed 40-character commit SHA.
  DesiredCount:
    Type: Number
    Default: 0
    AllowedValues: [0, 1]
    Description: Keep zero until the controlled one-shot migration succeeds.
  OriginToken:
    Type: String
    NoEcho: true
    AllowedPattern: "[0-9a-fA-F]{64}"
    Description: Secret 64-hex CloudFront X-Spry-Origin header value.
  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: "pl-[0-9a-f]+"
    Description: Regional CloudFront origin-facing managed prefix list (Stockholm pl-fab65393).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub "${ProjectName}-vpc"}
        - {Key: Project, Value: !Ref ProjectName}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.20.0.0/24
      Tags:
        - {Key: Name, Value: !Sub "${ProjectName}-public-1"}
        - {Key: Project, Value: !Ref ProjectName}
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.20.1.0/24
      Tags:
        - {Key: Name, Value: !Sub "${ProjectName}-public-2"}
        - {Key: Project, Value: !Ref ProjectName}
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.20.2.0/24
      Tags:
        - {Key: Name, Value: !Sub "${ProjectName}-private-1"}
        - {Key: Project, Value: !Ref ProjectName}
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.20.3.0/24
      Tags:
        - {Key: Name, Value: !Sub "${ProjectName}-private-2"}
        - {Key: Project, Value: !Ref ProjectName}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PublicSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable
  # The private route table has only the VPC-local route: no NAT or endpoints.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  PrivateSubnet1RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateSubnet2RouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTP only from CloudFront origin-facing addresses
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API ingress only from the ALB; outbound for database and AWS services
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from service and controlled migration tasks
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref TaskSecurityGroup
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  DatabaseCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName} PostgreSQL master credentials"
      GenerateSecretString:
        SecretStringTemplate: '{"username":"spry"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
        IncludeSpace: false
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private isolated PostgreSQL subnets
      SubnetIds: [!Ref PrivateSubnet1, !Ref PrivateSubnet2]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  Database:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # Tool's bundled version list stops at 16.11; live Stockholm
          # describe-orderable-db-instance-options confirms 16.15/t4g.micro/gp3.
          ignore_checks: [E3691]
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub "${ProjectName}-db"
      Engine: postgres
      EngineVersion: "16.15"
      DBInstanceClass: db.t4g.micro
      DBName: spry
      MasterUsername: spry
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DatabaseCredentials}:SecretString:password}}"
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      # Free plan rejected seven days; use the API's one-day retention default.
      BackupRetentionPeriod: 1
      DeleteAutomatedBackups: false
      DeletionProtection: true
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: false
      EnablePerformanceInsights: false
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  # Resolve credentials only into Secrets Manager, never into the task definition.
  DatabaseUrlSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub "${ProjectName} TLS PostgreSQL connection URL"
      SecretString: !Sub "postgresql+psycopg://spry:{{resolve:secretsmanager:${DatabaseCredentials}:SecretString:password}}@${Database.Endpoint.Address}:5432/spry?sslmode=require"
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  BackendLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${ProjectName}-backend"
      RetentionInDays: 7
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"
      Policies:
        - PolicyName: ReadDatabaseUrl
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseUrlSecret
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${ProjectName}-backend"
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${ProjectName}-backend"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Essential: true
          Image: !Ref ImageUri
          WorkingDirectory: /app
          Command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          PortMappings:
            - ContainerPort: 8000
              Protocol: tcp
          Environment:
            - Name: CORS_ORIGINS
              Value: ""
          Secrets:
            - Name: DATABASE_URL
              ValueFrom: !Ref DatabaseUrlSecret
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref BackendLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn:
      - InternetGatewayAttachment
      - PublicDefaultRoute
      - PublicSubnet1RouteAssociation
      - PublicSubnet2RouteAssociation
    Properties:
      Type: application
      Scheme: internet-facing
      IpAddressType: ipv4
      Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8000
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/health
      Matcher: {HttpCode: "200"}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Forbidden
  OriginHeaderRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ALBListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Spry-Origin
            Values: [!Ref OriginToken]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
  Service:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListener
      - OriginHeaderRule
      - PublicDefaultRoute
      - PublicSubnet1RouteAssociation
      - PublicSubnet2RouteAssociation
    Properties:
      ServiceName: !Sub "${ProjectName}-backend"
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnet1, !Ref PublicSubnet2]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: backend
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

Outputs:
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
  TaskSecurityGroupId:
    Value: !Ref TaskSecurityGroup
  LoadBalancerDomainName:
    Value: !GetAtt LoadBalancer.DNSName
  DatabaseIdentifier:
    Value: !Ref Database
  DatabaseUrlSecretArn:
    Value: !Ref DatabaseUrlSecret
