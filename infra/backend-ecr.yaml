AWSTemplateFormatVersion: "2010-09-09"
Description: Spry backend ECR repository - bootstrap before building the reviewed SHA image.

Parameters:
  ProjectName:
    Type: String
    Default: spry
    AllowedPattern: "[a-z][a-z0-9-]{0,25}"
    Description: Resource name prefix and project tag.

Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub "${ProjectName}-backend"
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      # No lifecycle expiry: deployed SHA images and rollback images must remain available.
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  OriginTokenSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "${ProjectName}/origin-token"
      Description: Shared CloudFront origin-header secret for local and OIDC deployments
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
        ExcludeUppercase: true
        ExcludeCharacters: ghijklmnopqrstuvwxyz
        RequireEachIncludedType: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

Outputs:
  OriginTokenSecretArn:
    Value: !Ref OriginTokenSecret
  RepositoryUri:
    Description: Push images tagged with the full reviewed commit SHA here.
    Value: !GetAtt BackendRepository.RepositoryUri
